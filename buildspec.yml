version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - docker build -t 230-territory-solver .
      - docker tag 230-territory-solver:latest $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/gilead-territory-solver:latest
  post_build:
    commands:
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/gilead-territory-solver:latest
 
